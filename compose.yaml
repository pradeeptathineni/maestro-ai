services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: maestro
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maestro -d maestro']
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      # PostgreSQL 18 stores major-version-specific data below this parent.
      - maestro-postgres:/var/lib/postgresql

volumes:
  maestro-postgres:
